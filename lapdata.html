<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lap Data For You!</title>
    <link rel="icon" type="image/jpeg" href="assets/heart.jpeg">
    <script src="js/lapdata.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
       <div  class = "header-top">
    <div class="race-info">
        <div class="track-data">
                <h2 id = "track"></h2>
                <h3 id = "loc"></h3>
                <h3 id = "stage"></h3>
        </div>
        <div class="winner-data">
            <h2>Podium</h2>
            <h3 id = "first"></h3>
            <h3 id = "second"></h3> 
            <h3 id = "third"></h3>
        </div>
    </div>
            <h1>Lap Data For You Baby!!</h1>
        </div>
        <div class="header-actions">
            <button class="button" onclick="window.location.href='index.html'">Back to Main Page!</button>
        </div>
        <h2 id="loader" ></h2>
    </header>
    <div class="row">
    <div width="100%";class="collum" >
       <table id="times">
            <tr>
                <th>Driver</th>
                <th>Position</th>
                <th>Best Lap Time</th>
                <th>Lap Number</th>
                <th>Gap to Leader</th>
            </tr>
        </table>
    </div>
    </div>
    </div>
    <script type="module">
    import { setlaps , getseshdata} from './js/lapdata.js';
    import {getpodium} from './js/f1data.js';
    document.addEventListener('DOMContentLoaded', async () => {
        getseshdata();
        setlaps();
        await getpodium();
    });
</script>
</body>
</html>
